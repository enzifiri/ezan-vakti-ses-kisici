<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="scene.css">
  <style>
    :root { --w: 1400px; --h: 560px; }
    .stage { grid-template-columns: 1fr 380px; gap: 60px; padding: 0 110px 0 100px; }
    .brand { display: flex; align-items: center; gap: 16px; }
    .brand img { width: 52px; height: 52px; }
    .brand span { font-size: 22px; font-weight: 600; }
    .caption h1 { font-size: 50px; }
    .caption p { max-width: none; }
    .popup-wrap { position: relative; height: 470px; }
    .popup { top: 0; right: 0; width: 300px; height: 392px; transform: scale(1.2); }
  </style>
</head>
<body>
  <div class="stage">
    <div class="caption">
      <div class="brand"><img src="../icons/icon128.png" alt=""><span>Ezan Vakti Ses Kapatıcı</span></div>
      <h1>Ezan okunurken müziğiniz kendiliğinden kısılsın</h1>
      <p>Diyanet vakitleri · Hesap gerekmez · Ezan bitince ses geri açılır</p>
    </div>
    <div class="popup-wrap"><iframe class="popup" src="popup-next.html"></iframe></div>
  </div>
</body>
</html>
