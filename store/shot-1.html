<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="scene.css">
  <style>
    :root { --w: 1280px; --h: 800px; }
    .stage { grid-template-columns: 430px 1fr; gap: 50px; padding: 0 60px 0 80px; }
    .browser { height: 600px; }
    .popup { top: 52px; right: 14px; width: 300px; height: 412px; transform: scale(1.18); }
  </style>
</head>
<body>
  <div class="stage">
    <div class="caption">
      <div class="tag">Ezan Vakti Ses Kapatıcı</div>
      <h1>Ezan okunurken müziğiniz kendiliğinden kısılsın</h1>
      <p>İlinizi seçin, gerisini eklenti yapar. Sıradaki ezana ne kadar kaldığını her an görürsünüz.</p>
    </div>
    <div class="browser">
      <div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="url">muzik.example</span><span class="ext"></span></div>
      <div class="player">
        <div class="cover"></div>
        <div class="track">
          <div class="now">Şimdi çalıyor</div>
          <div class="title">Sabah Yürüyüşü</div>
          <div class="artist">Enstrümantal Akustik</div>
          <div class="progress"></div>
          <div class="volume">Ses <span class="meter"><i style="right: 30%"></i></span> %70</div>
        </div>
      </div>
      <iframe class="popup" src="popup-next.html"></iframe>
    </div>
  </div>
</body>
</html>
